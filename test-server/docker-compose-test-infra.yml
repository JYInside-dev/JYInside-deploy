services:

  #====================================================================================
  # Test 서버
  #====================================================================================

  # 데이터베이스 컨테이너
  db:
    image: mysql:8.0
    restart: always

    env_file:
      - ./.env

    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}             # MySQL이 시작될 때 이 유저를 생성
      MYSQL_PASSWORD: ${DB_PASSWORD}     # 생성된 유저의 비밀번호 설정
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}

    healthcheck: # DB가 정말로 준비되었는지 확인하는 로직
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

    volumes:
      - db-test-data:/var/lib/mysql  # 컨테이너가 삭제되어도 데이터가 유지되도록 볼륨 설정

    networks:
      - test-global-network



  # 무중단 배포를 위한 로드밸런서로 nginx 사용.
  nginx:
    image: nginx:stable-alpine
    ports:
      - "8000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    networks:
      - test-global-network



  # 모니터링을 위한 Uptime-Kuma 사용
  uptime-kuma:
    image: louislam/uptime-kuma:2
    ports:
      - "4001:3001"
    volumes:
      - uptime-kuma-test-data:/app/data
    restart: unless-stopped
    networks:
      - test-global-network


  # 로그 시작화 대시보드
  grafana:
    image: grafana/grafana:main-ubuntu
    volumes:
      - grafana-test-data:/var/lib/grafana
    networks:
      - test-global-network
    environment:
      # Grafana에게 자신이 /grafana 경로 아래에서 서비스되고 있음을 명시적으로 알림
      - GF_SERVER_ROOT_URL=http://localhost:8000/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true



  # 로그 DB
  loki:
    image: grafana/loki:main-c83d748
    ports:
      - "4100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - test-global-network
    volumes:
      - loki-test-data:/loki


  # 로그 수집기
  alloy:
    image: grafana/alloy
    ports:
      - "13345:12345"
    networks:
      - test-global-network

    volumes:
      # 호스트의 로그 폴더를 컨테이너 내부에 마운트 (읽기 전용)
      - ./logs:/var/log:ro
      # Alloy 설정 파일 마운트
      - ../config.alloy:/etc/alloy/config.alloy:ro
    command:
      # Alloy 실행 명령어 및 설정 파일 지정
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
    depends_on:
      - loki


# 볼륨
volumes:
  db-test-data:
  uptime-kuma-test-data:
  grafana-test-data:
  loki-test-data:


networks:
  test-global-network:
    external: true
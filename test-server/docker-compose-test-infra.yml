services:

  #====================================================================================
  # Test 서버
  #====================================================================================

  # 데이터베이스 컨테이너
  db:
    image: mysql:8.0
    restart: always

    env_file:
      - ./.env

    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}             # MySQL이 시작될 때 이 유저를 생성
      MYSQL_PASSWORD: ${DB_PASSWORD}     # 생성된 유저의 비밀번호 설정
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}

    healthcheck: # DB가 정말로 준비되었는지 확인하는 로직
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

    volumes:
      - db-test-data:/var/lib/mysql  # 컨테이너가 삭제되어도 데이터가 유지되도록 볼륨 설정

    networks:
      - test-global-network



  # 무중단 배포를 위한 로드밸런서로 nginx 사용.
  nginx:
    image: nginx:stable-alpine
    ports:
      - "8000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    networks:
      - test-global-network



  # 모니터링을 위한 Uptime-Kuma 사용
  uptime-kuma:
    image: louislam/uptime-kuma:2
    ports:
      - "4001:3001"
    volumes:
      - uptime-kuma-test-data:/app/data
    restart: unless-stopped
    networks:
      - test-global-network


  # 로그 시작화 대시보드
  grafana:
    image: grafana/grafana:main-ubuntu
    volumes:
      - grafana-test-data:/var/lib/grafana
    networks:
      - test-global-network
    environment:
      # Grafana에게 자신이 /grafana 경로 아래에서 서비스되고 있음을 명시적으로 알림
      - GF_SERVER_ROOT_URL=http://localhost:8000/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true



  # 로그 DB
  loki:
    image: grafana/loki:main-c83d748
    ports:
      - "4100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - test-global-network
    volumes:
      - loki-test-data:/loki


  # 서버 상태 확인을 위한 로그 수집기
  alloy:
    image: grafana/alloy
    ports:
      - "13345:12345"
    networks:
      - test-global-network

    volumes:
      # 호스트의 로그 폴더를 컨테이너 내부에 마운트 (읽기 전용)
      - ./logs:/var/log:ro
      # Alloy 설정 파일 마운트
      - ../config.alloy:/etc/alloy/config.alloy:ro
    command:
      # Alloy 실행 명령어 및 설정 파일 지정
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
    depends_on:
      - loki



  # 서비스 로직을 위한 로그 수집기
  fluentd:
    build:
      context: ./fluentd      # Dockerfile이 있는 폴더 경로
      dockerfile: Dockerfile
    volumes:
      #- ./logs:/var/log/community:ro

      # 로그 공용 볼륨으로 로그 공유
      - test-shared-logs:/var/log/community:ro
      - ./fluentd/fluent.conf:/fluentd/etc/fluent.conf:ro
    user: root # 볼륨으로  마운트된 호스트의 로그 파일을 읽기 위해 root 권한 사용
    networks:
      - test-global-network



  kafka:
    image: apache/kafka:4.2.1
    ports:
      - "9092:9092"
    networks:
      - test-global-network
    volumes:
      - ./kafka-data:/tmp/kafka-logs
      # 클라우드에서는 따로 로컬 디렉토리 안만듥도 도커볼륨생성해서 사용
      # - kafka-test-data:/tmp/kafka-logs



    environment:
      # Bitnami의 KAFKA_CFG_ 접두사가 사라지고 아파치 표준 환경변수를 사용합니다.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092


      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT

      # 브로커 간 통신에 쓸 이름
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # KRaft 모드에서는 클러스터 ID가 필수입니다. (임의의 식별자)
      KAFKA_CLUSTER_ID: "community-realtime-cluster"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1


  redis:
    image: redis:8.8-alpine
    ports:
      - "6379:6379"
    networks:
      - test-global-network
    volumes:
      - redis-test-data:/data
      # 서버가 꺼져도 디스크에 데이터를 기록하여 날아가지 않게 하는 옵션
    command: redis-server --appendonly yes





# 볼륨
volumes:
  db-test-data:
  uptime-kuma-test-data:
  grafana-test-data:
  loki-test-data:
  kafka-test-data:
  redis-test-data:
  test-shared-logs:
    name: community-shared-logs


networks:
  test-global-network:
    external: true
worker_processes auto;

events{
    # 하나의 worker_process가 처리할 수 있는 연결 수
    worker_connections 1024;
}

http{
    # 65초 동안 tcp 연결이 없으면 종료
    keepalive_timeout 65;


# 실핼할 때 nginx서버 안꺼트리기 위해서 로드밸런싱 변수로서 직접 넣어줌
# =======================================================================
#     # 로드밸런싱할 서버 포트 설정
#     upstream backend_server{
#         # 현재 트래픽이 향하는곳: Docker Compose 파일 안의 backend-blue 서비스의 8080
#         server backend-blue:8080;
#     }
#
#     upstream frontend_server{
# #         프론트엔드 이미지를 빌드할때만 nodejs쓰고 실행은 nginx로 해서 80으로 보내야합니다
# #         헷갈리면 안돼요!
#         server frontend-blue:80;
#     }


    # 핵심: Docker의 내부 DNS 서버 IP (고정)
    # valid=30s는 30초마다 DNS 캐시를 갱신한다는 의미입니다.
    resolver 127.0.0.11 valid=30s;


    server{

        # nginx 접근 포트
        listen 80;

        # 로드밸런싱 할 url 라우팅 설정

        # 80/api 로 보내는 요청은 전부 여기로
        location /api{

            # 변수로 로드밸런싱 주소 직접 넣기
            set $backend "http://backend-test:8080";
            proxy_pass $backend;

            # 여기는 뭐라는지 모르겠어요 좀 더 공부해야 할듯 일단 코드는 넣어둠.
            # --- Proxy Headers 설정 ---
            # 리버스 프록시를 거치면 백엔드(Spring) 입장에서는 모든 요청이 Nginx의 IP로 들어온 것으로 보입니다.
            # 클라이언트의 실제 IP와 호스트 정보를 잃어버리지 않고 백엔드로 전달하기 위해 헤더를 조작합니다.


            # 원래 요청의 Host 도메인 유지
            proxy_set_header Host $http_host;


            # 클라이언트의 실제 IP 주소 전달 (로깅이나 IP 밴 처리에 필수)
            proxy_set_header X-Real-IP $remote_addr;

            # 프록시 서버들을 거쳐온 IP들의 체인 정보 전달
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # 원래 클라이언트가 사용한 프로토콜(HTTP/HTTPS) 정보 전달
            proxy_set_header X-Forwarded-Proto $scheme;
        }


        # 여기는 기본경로 프론트엔드로 쏨
        location / {
            set $frontend "http://frontend-test:80";
            proxy_pass $frontend;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

             # WebSocket 통신이 필요한 FE(예: React의 HMR 기능 등)를 위한 추가 헤더 설정
#             proxy_set_header Upgrade $http_upgrade;
#             proxy_set_header Connection "upgrade";
        }

        location /grafana {
            set $grafana "http://grafana:3000";
            proxy_pass $grafana;

            proxy_http_version 1.1;

            # 원래 클라이언트 정보 보존 (Proxy Headers)
            # Nginx가 중계하면서 패킷의 출발지 IP가 Nginx IP로 덮어씌워지는 것을 방지합니다.
            proxy_set_header Host $host;                                 # 원래 요청된 도메인/IP 유지
            proxy_set_header X-Real-IP $remote_addr;                     # 실제 접속한 클라이언트 IP
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; # 거쳐온 프록시 서버들의 IP 체인
            proxy_set_header X-Forwarded-Proto $scheme;                  # 원래 프로토콜 (http/https)

            # WebSocket 통신 지원 (중요)
            # Grafana는 실시간 데이터 스트리밍을 위해 TCP 기반의 양방향 통신인 WebSocket을 사용합니다.
            # HTTP/1.1의 Upgrade 메커니즘을 사용해 연결을 WebSocket으로 전환하도록 허용합니다.
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

        }
    }

}

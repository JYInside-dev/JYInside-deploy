services:
#====================================================================================
  # Test 서버
#====================================================================================

  backend-test:
    #image: ${BACKEND_IMAGE}
    build:
      context: ../community-backend # Dockerfile이 있는 폴더 경로
      dockerfile: Dockerfile
    restart: on-failure

    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}       # Spring에 유저명 전달
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}   # Spring에 비밀번호 전달
      SPRING_PROFILES_ACTIVE: prod # 도커로 실행할 때에는 로그파일 작성
      OPS_SERVER_MODE: ${OPS_SERVER_MODE}   # 현재 테스트 서버인지 서비스 서버인지
      OPS_BACKEND_HEALTH_URL: ${OPS_BACKEND_HEALTH_URL}
      OPS_FRONTEND_HEALTH_URL: ${OPS_FRONTEND_HEALTH_URL}
      OPS_NGINX_HEALTH_URL: ${OPS_NGINX_HEALTH_URL}

      # 💡 Redis 접속 주소를 localhost가 아닌 도커 서비스명 redis 으로 덮어쓰기
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 30
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: 10
      SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT: 3000


    volumes:
      - ./ops:/app/ops
      #- ./logs:/var/log/community
      - test-shared-logs:/var/log/community


    networks:
      - test-global-network

  frontend-test:
    #image: ${FRONTEND_IMAGE}
    build:
      context: ../community-frontend # Dockerfile이 있는 폴더 경로
      dockerfile: Dockerfile

    networks:
      - test-global-network


volumes:
  test-shared-logs:
    external: true
    name: community-shared-logs


# 도커내의 글로벌 네트워크에 연결
# 인프라 compose와 통신
networks:
  test-global-network:
    external: true


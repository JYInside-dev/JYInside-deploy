# 1. Source: 스프링 부트 로그 파일 읽기

<source>
  @type tail
  path /var/log/community/community-server.log

  # Fluentd가 어디까지 읽었는지 기억하는 영수증 같은 파일입니다.
  # 수정된 부분: 로그 폴더가 아닌, 컨테이너 내부의 임시 폴더(/tmp)에 책갈피를 저장합니다.
  pos_file /tmp/community-server.log.pos
  tag community.logs


  # logback-spring.xml에서 만든 JSON 형태를 그대로 파싱합니다.
  <parse>
    @type json
  </parse>
</source>

# "message" 필드 안에 "[TrackView AOP 작동]" 이라는 단어가 있는 로그만 통과시킵니다.
    <filter community.logs>
      @type grep
      <regexp>
        key message
        pattern /\[@TrackView AOP 작동\]/
      </regexp>
    </filter>


# 2. Match: 읽어온 로그를 Kafka로 쏘기
<match community.logs>
  @type kafka2

  # 카프카 서버 주소 (docker-compose의 서비스명인 kafka와 포트 9092)
  brokers kafka:9092

  # 카프카에 전송할 기본 토픽 이름 (실시간 인기글 용도)
  default_topic post-views

  # 💡 추가: 카프카 기본 제한(1MB)을 넘지 않도록 택배 상자 크기 제한
  max_send_limit_bytes 500000

  # 전송할 때도 JSON 포맷을 유지합니다.
  <format>
    @type json
  </format>


  # 비동기 전송 시 버퍼 설정 (성능 최적화)
  <buffer>
    @type memory
    flush_interval 3s    # 1초마다 카프카로 모아서 전송 (실시간성 보장)
    chunk_limit_size 500k  # 한 번에 보낼 최대 청크 크기
  </buffer>
</match>
stages:
  - prepare
  - build
  - deploy

prepare_context:
  stage: prepare
  # 버튼 눌러 실행하도록 변경
  when: manual
  allow_failure: false
  tags:
    - saas-linux-small-amd64
  inputs:
    DEPLOY_REF:
      type: string
      default: "main"
      description: "deploy 프로젝트에서 불러올 브랜치 명 / 기본값은 main"
    BACKEND_REF:
      type: string
      default: ""
      description: "배포할 백앤드 이미지 / 미입력 시 현재 브랜치"
    FRONTEND_REF:
      type: string
      default: ""
      description: "배포할 프론트앤드 이미지 / 미입력 시 현재 브랜치"
  script:
    - BACKEND_REF_VALUE="${BACKEND_REF:-$CI_COMMIT_REF_SLUG}"
    - FRONTEND_REF_VALUE="${FRONTEND_REF:-$CI_COMMIT_REF_SLUG}"
    - echo "DEPLOY_REF=${DEPLY_REF:-main}" > deploy.env
    - echo "BACKEND_REF=$BACKEND_REF_VALUE" >> deploy.env
    - echo "FRONTEND_REF=$FRONTEND_REF_VALUE" >> deploy.env
    # BACKEND_IMAGE, FRONTEND_IMAGE : compose가 실제로 가져올 이미지 주소
    - echo "BACKEND_IMAGE=registry.gitlab.com/sku-sw-academy-group/community-backend/backend:$BACKEND_REF_VALUE" >> deploy.env
    - echo "FRONTEND_IMAGE=registry.gitlab.com/sku-sw-academy-group/community-frontend/frontend:$FRONTEND_REF_VALUE" >> deploy.env
  artifacts:
    reports:
      dotenv: deploy.env

deploy_compose:
  stage: deploy
  tags:
    - test-server
  script:
    - cd /mnt/c/DH_cloud_backend/SW-project/SW-project-deploy
    - git pull "https://${DEPLOY_REPO_USER}:${DEPLOY_REPO_TOKEN}@gitlab.com/Sku-sw-academy-group/community-deploy.git" "${DEPLOY_REF:-main}"
    #     불러올 이미지 변수 저장
    - sed -i "s|^BACKEND_IMAGE=.*|BACKEND_IMAGE=$BACKED_IMAGE|" .env
    - sed -i "s|^FRONTEND_IMAGE=.*|FRONTEND_IMAGE=$FRONTED_IMAGE|" .env
    - echo "$REGISTRY_PASSWORD" | docker login registry.gitlab.com -u "$REGISTRY_USER" --password-stdin
    - docker compose --env-file .env.runtime pull
    - docker compose --env-file .env.runtime up -d
  rules:
    - if: '$CI_COMMIT_BRANCH'
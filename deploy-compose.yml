deploy_compose:
  stage: deploy
  tags:
    - test-server
  script:
    - echo "$REGISTRY_PASSWORD" | docker login registry.gitlab.com -u "$REGISTRY_USER" --password-stdin
    - cd /mnt/c/DH_cloud_backend/SW-project/SW-project-deploy
    - git pull origin cd-test
    - docker compose pull
    - docker compose up -d
  rules:
    - if: '$CI_COMMIT_BRANCH == "cd-test"'
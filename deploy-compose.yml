stages:
  - prepare
  - build
  - deploy

prepare_context:
  stage: prepare
  # 버튼 눌러 실행하도록 변경
  when: manual
  allow_failure: false
  tags:
    - saas-linux-small-amd64
  inputs:
    DEPLOY_REF:
      type: string
      default: "main"
      description: "deploy 프로젝트에서 불러올 브랜치 명 / 기본값은 main"
    BACKEND_REF:
      type: string
      default: $CI_COMMIT_REF_SLUG
      description: "배포할 백앤드 이미지"
    FRONTEND_REF:
      type: string
      default: $CI_COMMIT_REF_SLUG
      description: "배포할 프론트앤드 이미지"
  script:
#    # DEPLOY_REF : deploy 프로젝트에서 불러올 브랜치명 / 기본값은 main
#    - echo "DEPLOY_REF=${DEPLOY_REF_OVERRIDE:-main}" >> deploy.env
#    # BACKEND_REF, FRONTEND_REF : 브랜치명을 docker 태그로 쓰기 좋게 변환 / 기본값은 현재 브랜치 명
#    - echo "BACKEND_REF=${BACKEND_REF_OVERRIDE:-$CI_COMMIT_REF_SLUG}" >> deploy.env
#    - echo "FRONTEND_REF=${FRONTEND_REF_OVERRIDE:-$CI_COMMIT_REF_SLUG}" >> deploy.env
    # BACKEND_IMAGE, FRONTEND_IMAGE : compose가 실제로 가져올 이미지 주소
    - echo "BACKEND_IMAGE=registry.gitlab.com/sku-sw-academy-group/community-backend/backend:$BACKEND_REF" >> deploy.env
    - echo "FRONTEND_IMAGE=registry.gitlab.com/sku-sw-academy-group/community-frontend/frontend:$FRONTEND_REF" >> deploy.env
  artifacts:
    reports:
      dotenv: deploy.env

deploy_compose:
  stage: deploy
  tags:
    - test-server
  script:
    - cd /mnt/c/DH_cloud_backend/SW-project/SW-project-deploy
    - git pull "https://${DEPLOY_REPO_USER}:${DEPLOY_REPO_TOKEN}@gitlab.com/Sku-sw-academy-group/community-deploy.git" "${DEPLOY_REF:-main}"
    - echo "$REGISTRY_PASSWORD" | docker login registry.gitlab.com -u "$REGISTRY_USER" --password-stdin
    - echo "BACKEND_IMAGE=${BACKEND_IMAGE}" >> .env.runtime
    - echo "FRONTEND_IMAGE=${FRONTEND_IMAGE}" >> .env.runtime
    - docker compose --env-file .env.runtime pull
    - docker compose --env-file .env.runtime up -d
  rules:
    - if: '$CI_COMMIT_BRANCH'

# TODO: 이 컴포즈 실행하기 전에 프론트/백엔드 서버 컴포즈랑 통신할 Network를 먼저 만들어야함
# TODO: 로그파일 마운트 수정.


services:

  # 데이터베이스 컨테이너
  db:
    image: mysql:8.0
    restart: always
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}             # MySQL이 시작될 때 이 유저를 생성
      MYSQL_PASSWORD: ${DB_PASSWORD}     # 생성된 유저의 비밀번호 설정
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}

    healthcheck: # DB가 정말로 준비되었는지 확인하는 로직
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

    volumes:
      - db_data:/var/lib/mysql # 컨테이너가 삭제되어도 데이터가 유지되도록 볼륨 설정



  # 무중단 배포를 위한 로드밸런서로 nginx 사용.
  # TODO: 백엔드 프론트엔드서버가 없어도 죽지 않도록 추가적으로 conf파일 수정해야함
  nginx:
    image: nginx:stable-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf


  # 모니터링을 위한 Uptime-Kuma 사용
  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: uptime-kuma
    ports:
      - "3001:3001"
    volumes:
      - uptime-kuma-data:/app/data
    restart: unless-stopped



  # 로그 시작화 대시보드
  grafana:
    image: grafana/grafana:main-ubuntu
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana

  # 로그 DB
  loki:
    image: grafana/loki:main-c83d748
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki-data:/loki


  # 로그 수집기
  alloy:
    image: grafana/alloy
    ports:
      - "12345:12345"
    volumes:
      # 호스트의 로그 폴더를 컨테이너 내부에 마운트 (읽기 전용)
      - ./logs:/var/log:ro
      # Alloy 설정 파일 마운트
      - ./config.alloy:/etc/alloy/config.alloy:ro
    command:
      # Alloy 실행 명령어 및 설정 파일 지정
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
    depends_on:
      - loki


# 볼륨
volumes:
  db_data:
  uptime-kuma-data:
  grafana-data:
  loki-data:
